group 'com.here.here_sdk'
version '1.0-SNAPSHOT'

def thisDir = buildscript.sourceFile.getParent()

buildscript {
    ext.kotlin_version = '1.5.31'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        flatDir {
            dirs "${thisDir}/libs"
        }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.here.here_sdk"
    compileSdkVersion 34
    buildToolsVersion '33.0.3'

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Require at least OpenGL ES 2.0 for lite and 3.0 for other variants.
        manifestPlaceholders["minSupportedGLESVersion"] =
                ('explore' == 'lite') ? "0x00020000" : "0x00030000"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation(name: 'heresdk-explore-4.21.0.0.156359.release', ext: 'aar')
}